    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Run Scraper
        run: python m_scraper.py --verbose
      - name: Commit and Push XML
        run: |
          git config --global user.name 'MBot'
          git config --global user.email 'bot@machitech.com'
          git add linkedin-jobs.xml
          git diff --cached --quiet || (git commit -m "Auto-update job feed" && git push)
